# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Agent Deployment Patterns (PLAYGROUND) - playground environment.
# A clean sandbox: it starts a kind cluster, deploys a client pod and a
# Collector agent (DaemonSet), then stays running for free exploration. No
# task, no grading, no `astrona submit`. UNTESTED: built without running it.
apiVersion: astrona.io/v1
metadata:
  name: ats-075-playground-020-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.162.0
      - curlimages/curl:8.22.0

# Starting state: one agent Collector per node that receives OTLP/HTTP traces
# and prints them with the debug exporter. It adds no Kubernetes attributes.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the client pod and the agent DaemonSet
      type: file
      source: bootstrap/01-seed-cluster.sh

teardown:
  keepCluster: false
