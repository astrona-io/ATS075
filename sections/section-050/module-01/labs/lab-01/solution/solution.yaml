apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      resource/environment:
        attributes:
          - key: deployment.environment.name
            value: training
            action: upsert
          - key: host.name
            action: delete
      attributes/privacy:
        actions:
          - key: http.request.header.authorization
            action: delete
          - key: user.email
            action: hash
      filter/noise:
        error_mode: ignore
        trace_conditions:
          - span.attributes["http.route"] == "/healthz"
        log_conditions:
          - log.severity_number < SEVERITY_NUMBER_INFO

    exporters:
      debug:
        verbosity: detailed

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource/environment, attributes/privacy, filter/noise]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [resource/environment]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [resource/environment, attributes/privacy, filter/noise]
          exporters: [debug]
