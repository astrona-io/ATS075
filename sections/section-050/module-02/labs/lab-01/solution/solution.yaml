apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      transform/redact:
        error_mode: ignore
        trace_statements:
          - 'replace_pattern(span.attributes["url.full"], "token=[^&]*", "token=REDACTED") where span.attributes["url.full"] != nil'
          - 'delete_key(span.attributes, "http.request.header.authorization")'
          - 'delete_key(span.attributes, "user.email")'
        log_statements:
          - 'replace_pattern(log.body.string, "card=[0-9]+", "card=****") where IsString(log.body)'
        metric_statements:
          - 'delete_key(datapoint.attributes, "user.id")'

    exporters:
      debug:
        verbosity: detailed

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform/redact]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [transform/redact]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [transform/redact]
          exporters: [debug]
