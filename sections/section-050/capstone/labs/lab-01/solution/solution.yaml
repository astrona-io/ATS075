apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      resource/environment:
        attributes:
          - key: deployment.environment.name
            value: starfleet-prod
            action: upsert
          - key: host.name
            action: delete
      attributes/privacy:
        actions:
          - key: http.request.header.authorization
            action: delete
          - key: user.email
            action: hash
      transform/redact:
        error_mode: ignore
        trace_statements:
          - 'replace_pattern(span.attributes["url.full"], "token=[^&]*", "token=REDACTED") where span.attributes["url.full"] != nil'
          - 'replace_pattern(span.attributes["http.target"], "\\?.*", "") where span.attributes["http.target"] != nil'
        log_statements:
          - 'replace_pattern(log.body.string, "card=[0-9]+", "card=****") where IsString(log.body)'
        metric_statements:
          - 'delete_key(datapoint.attributes, "user.id")'
      filter/noise:
        error_mode: ignore
        trace_conditions:
          - span.attributes["http.target"] == "/healthz"
        log_conditions:
          - log.severity_number < SEVERITY_NUMBER_INFO
        metric_conditions:
          - metric.name == "scout.debug.counter"

    exporters:
      debug:
        verbosity: detailed

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource/environment, attributes/privacy, transform/redact, filter/noise]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [resource/environment, attributes/privacy, transform/redact, filter/noise]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [resource/environment, attributes/privacy, transform/redact, filter/noise]
          exporters: [debug]
