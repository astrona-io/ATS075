# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Use Environment Values, Secrets And Extensions (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-075-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - otel/opentelemetry-collector-contrib:0.162.0
      - curlimages/curl:8.22.0

# Starting state: an agent Collector with two configuration files, a literal environment value, a literal token and a health_check extension that is defined but not enabled. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: "Create the gateway, the shuttle sender and the agent with a faulty configuration"
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: "Apply the reference solution"
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: "Wait until only the new agent pod is left"
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: agent-ready
      description: "The agent Deployment is available with the original image"
      type: file
      source: validation/validate-agent-ready.sh
      hint: "Read the pod log with kubectl logs. If the new pod does not start, a file has an error."
    - name: health-check
      description: "The health_check extension answers on port 13133"
      type: file
      source: validation/validate-health-check.sh
      hint: "An extension that is defined must also be listed under service extensions."
    - name: environment-attribute
      description: "deployment.environment comes from DEPLOY_ENV"
      type: file
      source: validation/validate-environment-attribute.sh
      hint: "Use ${env:DEPLOY_ENV} as the value, not a literal. The Collector expands the value when it starts, so restart the Deployment."
    - name: secret-from-env
      description: "The token comes from the Secret through BACKEND_TOKEN"
      type: file
      source: validation/validate-secret-from-env.sh
      hint: "Remove the literal token and write Bearer ${env:BACKEND_TOKEN}. The Deployment already has the variable."
    - name: second-receiver
      description: "The named receiver otlp/second accepts traces on port 4319"
      type: file
      source: validation/validate-second-receiver.sh
      hint: "Define otlp/second with an HTTP endpoint on 0.0.0.0:4319 and list it in the traces pipeline."
    - name: primary-receiver
      description: "The receiver otlp still accepts traces on port 4318"
      type: file
      source: validation/validate-primary-receiver.sh
      hint: "A list in the second file replaces the whole list from the first file. Write both receivers: otlp and otlp/second."

teardown:
  keepCluster: false
