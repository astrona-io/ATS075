apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: starfleet
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      attributes/redact:
        actions:
          - key: user.email
            action: delete
    exporters:
      debug:
        verbosity: detailed
      otlphttp/backend:
        endpoint: http://backend.starfleet.svc.cluster.local:4318
      otlphttp/archive:
        endpoint: http://archive.starfleet.svc.cluster.local:4318
        sending_queue:
          enabled: true
          queue_size: 100
    connectors:
      count: {}
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [attributes/redact]
          exporters: [otlphttp/archive, otlphttp/backend, debug, count]
        metrics:
          receivers: [count]
          exporters: [otlphttp/backend]
