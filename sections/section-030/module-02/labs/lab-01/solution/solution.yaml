# Reference solution for the routing lab: load_balancing by trace ID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: starfleet
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 40
      batch:
        timeout: 1s
    exporters:
      load_balancing:
        routing_key: traceID
        protocol:
          otlp:
            tls:
              insecure: true
            sending_queue:
              queue_size: 5000
        resolver:
          dns:
            hostname: sampler-headless.starfleet.svc.cluster.local
            port: 4317
            interval: 5s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [load_balancing]
