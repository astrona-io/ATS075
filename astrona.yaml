    description: >
      Makes the reader able to choose where Collectors run in a Kubernetes
      cluster and what each tier owns. It covers the agent patterns (sidecar,
      DaemonSet and direct export) with edge enrichment, host metrics and
      failure domains, and the gateway tier with agent-to-gateway export,
      central credentials, buffering, retry and replicas.

