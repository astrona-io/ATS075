# Course manifest for ATS075. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS075
  title: 'OTCA: The OpenTelemetry Collector'
  description: Concept lessons, diagrams, playgrounds, graded labs, capstones and original scenario quizzes
    covering every published objective in this OTCA domain. Labs run on kind (Kubernetes 1.35). Technical content remains draft.
  certification:
    name: OpenTelemetry Certified Associate
    code: OTCA
    provider: CNCF / Linux Foundation
    domain: The OpenTelemetry Collector
    weight: 26
    competencies:
    - Configuration
    - Deployment
    - Scaling
    - Pipelines
    - Transforming Data
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
